<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11182b">
  <meta name="description" content="MOSKE — a gamified, offline-first triathlon training tracker.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MOSKE">
  <title>MOSKE — Triathlon Training Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <div id="storage-banner" class="storage-banner" hidden role="alert">
    ⚠️ Storage is blocked (private mode?). Your data is kept in memory only and will be lost when you close this tab.
  </div>

  <header class="app-header">
    <div class="brand">
      <img class="logo" src="icons/icon.svg" alt="MOSKE" width="36" height="36">
      <div><strong>MOSKE</strong><small>train · level up · race</small></div>
      <button id="settings-btn" class="icon-btn header-settings" aria-label="Settings">⚙️</button>
    </div>
    <div id="hud" class="hud"></div>
  </header>

  <div id="race-banner"></div>
  <div id="sync-banner"></div>

  <main id="view" class="view" role="main" aria-live="polite"></main>

  <nav class="tabs" aria-label="Views">
    <button class="tab active" data-action="tab" data-tab="today"><span>📅</span>Today</button>
    <button class="tab" data-action="tab" data-tab="week"><span>🗓️</span>Week</button>
    <button class="tab" data-action="tab" data-tab="progress"><span>📈</span>Progress</button>
  </nav>

  <button id="fab" class="fab" aria-label="Add a session">+</button>

  <div id="modal-root" class="modal-root"></div>
  <div id="toast-wrap" class="toast-wrap" aria-live="polite"></div>

  <noscript><p style="padding:2rem;text-align:center">TriQuest needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/app/main.js"></script>
</body>
</html>
