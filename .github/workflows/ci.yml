name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The test runner is built into Node. The one dev dependency the tests use
      # is PGlite, to run the migrations and check the SQL matches js/core
      # (tests/gear-sql.test.js); sharp is build-time only, so scripts are skipped.
      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run tests
        run: npm test
