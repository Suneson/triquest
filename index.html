<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11182b">
  <meta name="description" content="MOSKE — a gamified, offline-first triathlon training tracker.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MOSKE">
  <title>MOSKE — Triathlon Training Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <div id="storage-banner" class="storage-banner" hidden role="alert">
    ⚠️ Storage is blocked (private mode?). Your data is kept in memory only and will be lost when you close this tab.
  </div>

  <header class="app-header">
    <div class="brand">
      <img class="logo" src="icons/icon-192.png" alt="MOSKE" width="36" height="36">
      <div><strong>MOSKE</strong><small>train · level up · race</small></div>
      <button id="settings-btn" class="icon-btn header-settings" aria-label="Settings">⚙️</button>
    </div>
    <div id="hud" class="hud"></div>
  </header>

  <div id="race-banner"></div>
  <div id="sync-banner"></div>

  <main id="view" class="view" role="main" aria-live="polite"></main>

  <nav class="tabs" aria-label="Views">
    <button class="tab active" data-action="tab" data-tab="today">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg></span>Today</button>
    <button class="tab" data-action="tab" data-tab="week">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7.5 13h.01M12 13h.01M16.5 13h.01M7.5 17h.01M12 17h.01"/></svg></span>Week</button>
    <button class="tab" data-action="tab" data-tab="progress">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5v15h16"/><path d="M7 15l4-4 3 3 5-6"/></svg></span>Progress</button>
  </nav>

  <button id="fab" class="fab" aria-label="Add a session">+</button>

  <div id="modal-root" class="modal-root"></div>
  <div id="toast-wrap" class="toast-wrap" aria-live="polite"></div>

  <noscript><p style="padding:2rem;text-align:center">TriQuest needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/app/main.js"></script>
</body>
</html>
