<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1222">
  <meta name="description" content="MOSKE — a gamified, offline-first triathlon training tracker.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MOSKE">
  <title>MOSKE — Triathlon Training Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" href="fonts/libre-franklin-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/shop.css">
  <link rel="stylesheet" href="css/chests.css">
</head>
<body>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <!-- The app shell: a fixed, full-screen grid of header / banners / view / tab
       bar. Nothing here depends on 100vh or 100dvh, so the bar can't float up. -->
  <div class="app">
    <div id="storage-banner" class="storage-banner" hidden role="alert" data-i18n="app.storageBlocked">
      Storage is blocked (private mode?). Your data is kept in memory only and will be lost when you close this tab.
    </div>

    <header class="app-header">
      <div class="brand">
        <strong>MOSKE</strong>
        <div class="header-actions">
          <button id="bell-btn" class="icon-btn bell-btn" data-action="open-bell" aria-label="Notifications" data-i18n-aria="nav.notifications" hidden><span data-icon="bell"></span></button>
          <button id="acct-chip" class="lvl-chip" data-action="pg-profile" aria-label="Account level" data-i18n-aria="nav.accountLevel" hidden></button>
          <button id="header-avatar" class="avatar-btn" data-action="pg-profile" aria-label="Open profile" data-i18n-aria="nav.openProfile">A</button>
        </div>
      </div>
    </header>

    <div id="race-banner"></div>
    <div id="sync-banner"></div>

    <main id="view" class="view"></main>

    <nav class="tabs" aria-label="Views" data-i18n-aria="nav.views">
      <button class="tab active" data-action="tab" data-tab="home"><span class="tab-ico" data-icon="home"></span><span class="tab-lbl" data-i18n="nav.home">Home</span></button>
      <button class="tab" data-action="tab" data-tab="shop"><span class="tab-ico" data-icon="shop"></span><span class="tab-lbl" data-i18n="nav.shop">Shop</span></button>
      <button class="tab" data-action="tab" data-tab="leaderboards"><span class="tab-ico" data-icon="trophy"></span><span class="tab-lbl" data-i18n="nav.ranks">Ranks</span></button>
      <button class="tab" data-action="tab" data-tab="chat"><span class="tab-ico" data-icon="chat"></span><span class="tab-lbl" data-i18n="nav.chat">Chat</span></button>
      <button class="tab" data-action="tab" data-tab="progress"><span class="tab-ico" data-icon="user"></span><span class="tab-lbl" data-i18n="nav.profile">Profile</span></button>
    </nav>

  </div>

  <button id="fab" class="fab" aria-label="Add a session" data-i18n-aria="nav.addSession"><span data-icon="plus"></span></button>

  <div id="toast-wrap" class="toast-wrap" aria-live="polite"></div>

  <noscript><p style="padding:2rem;text-align:center">MOSKE needs JavaScript enabled.<br><span lang="es">MOSKE necesita JavaScript activado.</span></p></noscript>
  <script type="module" src="js/app/main.js"></script>
</body>
</html>
